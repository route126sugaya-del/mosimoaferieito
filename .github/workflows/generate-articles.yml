name: Collect Affiliate Product Candidates

on:
  schedule:
    # 毎日 UTC 23:00 (JST 翌8:00) に実行
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Search products and build moshimo links
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_COUNTRY: ${{ vars.AMAZON_COUNTRY }}
          MOSHIMO_RAKUTEN_A_ID: ${{ secrets.MOSHIMO_RAKUTEN_A_ID }}
          MOSHIMO_RAKUTEN_P_ID: ${{ secrets.MOSHIMO_RAKUTEN_P_ID }}
          MOSHIMO_RAKUTEN_PC_ID: ${{ secrets.MOSHIMO_RAKUTEN_PC_ID }}
          MOSHIMO_RAKUTEN_PL_ID: ${{ secrets.MOSHIMO_RAKUTEN_PL_ID }}
          MOSHIMO_AMAZON_A_ID: ${{ secrets.MOSHIMO_AMAZON_A_ID }}
          MOSHIMO_AMAZON_P_ID: ${{ secrets.MOSHIMO_AMAZON_P_ID }}
          MOSHIMO_AMAZON_PC_ID: ${{ secrets.MOSHIMO_AMAZON_PC_ID }}
          MOSHIMO_AMAZON_PL_ID: ${{ secrets.MOSHIMO_AMAZON_PL_ID }}
          PRODUCTS_PER_RUN: ${{ vars.PRODUCTS_PER_RUN }}
        run: python -m moshimo_articles.main

      - name: Commit product queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/product_queue.json
          git diff --cached --quiet || git commit -m "chore: 商品キューを更新"
          git push
